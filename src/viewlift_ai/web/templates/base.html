<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Viewlift AI: local network proxy, log stream and SDK capture for iOS and tvOS debug builds.">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}{{ title }} · Viewlift AI{% endblock %}</title>
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem("vl-theme");
        if (theme === "light" || theme === "dark") root.dataset.theme = theme;
        if (localStorage.getItem("vl-rail") === "collapsed") root.dataset.rail = "collapsed";
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/css/app.css?v=12">
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Viewlift AI">
      <a class="brand" href="/" aria-label="Viewlift AI home">
        <img class="brand-logo" src="/static/img/viewlift-logo.png?v=1" width="200" height="87" alt="ViewLift, a DAZN company">
      </a>

      <nav class="nav" aria-label="Primary">
        <a href="/" class="nav-link{% if active_nav == 'network' %} active{% endif %}"{% if active_nav == 'network' %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
          <span>Network</span>
        </a>
        <a href="/logs" class="nav-link{% if active_nav == 'logs' %} active{% endif %}"{% if active_nav == 'logs' %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 17 6-6-6-6"></path><path d="M12 19h8"></path></svg>
          <span>Logs</span>
        </a>
        <a href="/rules" class="nav-link{% if active_nav == 'rules' %} active{% endif %}"{% if active_nav == 'rules' %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg>
          <span>Rules</span>
        </a>
        <a href="/debug" class="nav-link{% if active_nav == 'debug' %} active{% endif %}"{% if active_nav == 'debug' %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 2 1.9 1.9M14.1 3.9 16 2M9 7.1v-1a3 3 0 1 1 6 0v1"></path><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6Zm0 0v-9"></path><path d="M6.5 9C4.6 8.8 3 7.1 3 5M6 13H2M3 21c0-2.1 1.7-3.9 3.8-4M21 5c0 2.1-1.6 3.8-3.5 4M22 13h-4M17.2 17c2.1.1 3.8 1.9 3.8 4"></path></svg>
          <span>Debug</span>
        </a>
        <a href="/agent" class="nav-link{% if active_nav == 'agent' %} active{% endif %}"{% if active_nav == 'agent' %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="2"></rect><path d="M12 8V4M8 4h8M9 13v2M15 13v2"></path></svg>
          <span>Agent</span>
        </a>
        <a href="/setup" class="nav-link{% if active_nav == 'setup' %} active{% endif %}"{% if active_nav == 'setup' %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path><path d="m9 12 2 2 4-4"></path></svg>
          <span>Setup</span>
        </a>
        <a href="/health" class="nav-link secondary">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 14 4-4"></path><path d="M3.3 19a10 10 0 1 1 17.4 0"></path></svg>
          <span>Health</span>
        </a>
      </nav>

      <div class="rail-foot">
        <div class="live" title="Live connection to the capture server">
          <span id="live-dot" class="live-dot" aria-hidden="true"></span>
          <span id="live-label" class="live-label" aria-live="polite">connecting</span>
        </div>
        <div class="rail-tools">
          <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch to light theme">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
          </button>
          <button type="button" class="icon-btn" id="rail-toggle" aria-label="Collapse sidebar" aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18"></path></svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="stage">
      <div id="mutating-banner" class="mutating-banner{% if mutating_enabled %} show{% endif %}" role="alert">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4M12 17h.01"></path></svg>
        <span>Mutating rules are on (map, rewrite, throttle, breakpoints). Captured traffic may differ from what the server sent.</span>
        <a href="/rules">Review rules</a>
      </div>
      <div class="scope-bar" id="scope-bar">
        <label class="scope-field" for="scope-select">
          <span class="scope-label">Scope</span>
          <select id="scope-select" aria-describedby="scope-meta">
            <option value="">All apps</option>
          </select>
        </label>
        <span id="scope-meta" class="scope-meta" aria-live="polite"></span>
        <button type="button" class="btn ghost scope-clear" id="scope-clear">Clear all data</button>
      </div>
      <main class="main{% if mutating_enabled %} with-banner{% endif %}">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <script src="/static/js/shell.js?v=4"></script>
  <script src="/static/js/app.js?v=15"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
